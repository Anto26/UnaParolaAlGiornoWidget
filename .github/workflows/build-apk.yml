name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Optional release-signing secrets (see the comment block at the bottom).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: UnaParolaWidget-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Optional: signed release APK (only when the keystore secrets exist) ----
      - name: Build release APK
        if: env.KEYSTORE_BASE64 != ''
        run: ./gradlew assembleRelease --stacktrace

      - name: Align and sign release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)"
          mkdir -p signed
          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/UnaParolaWidget-release.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify signed/UnaParolaWidget-release.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload signed release APK
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: UnaParolaWidget-release-apk
          path: signed/UnaParolaWidget-release.apk
          if-no-files-found: error

  # Publishes the APK(s) to a GitHub Release when you push a tag like v1.0.0
  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true

# How to enable signed release builds (optional):
#   1. keytool -genkey -v -keystore release.jks -alias mykey -keyalg RSA -keysize 2048 -validity 10000
#   2. base64 -w0 release.jks   (macOS: base64 -i release.jks)
#   3. In GitHub: Settings > Secrets and variables > Actions, add:
#        KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
# Without these secrets the workflow still builds an installable debug APK.
